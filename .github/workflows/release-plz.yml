# release-plz keeps a release PR with the next version and changelog from
# conventional commits; merging it tags the release, creates the GitHub
# release and publishes to crates.io through trusted publishing (OIDC). The
# first version of a new crate is published by hand; its trusted publisher is
# configured right after.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
